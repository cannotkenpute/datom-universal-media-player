name: datom_universal_media_player
description: A device-independent player and converter for datom media files.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cross_file: ^0.3.5+2
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_file_dialog: 3.0.3
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  video_player: 2.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.29.0

flutter:
  uses-material-design: true
